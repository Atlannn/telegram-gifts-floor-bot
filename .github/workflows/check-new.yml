name: Check for new gift collections

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by 10-30 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the messages instead of sending them"
        type: boolean
        default: true

permissions:
  contents: write           # lets the built-in token commit state.json

# state.json is shared with the daily post, so the two jobs must not run at the same time
concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python check_new.py --dry-run
      - name: Check and announce
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_new.py
      - name: Save state
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Update known collections $(date -u +%F)" && git pull --rebase && git push; }
