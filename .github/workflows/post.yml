name: Post to Telegram channel

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC, after the data repo collects (about 06:20) and publishes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the messages instead of sending them"
        type: boolean
        default: true

permissions:
  contents: write           # lets the built-in token commit state.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python bot.py --dry-run
      - name: Post
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py
      - name: Save state
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state $(date -u +%F)"
          git push
